name: Build iOS IPA & Android Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS Package (IPA)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA from Runner.app
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r OkamuraGolf.ipa Payload
          zip -r OkamuraGolf_RunnerApp.zip build/ios/iphoneos/Runner.app

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkamuraGolf-iOS-IPA
          path: OkamuraGolf.ipa
          retention-days: 14

      - name: Upload iOS Runner App Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OkamuraGolf-iOS-Runner-App
          path: OkamuraGolf_RunnerApp.zip
          retention-days: 14
